<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bikes Summit Awards — Portal de Votação do Júri</title>
  <style>
    :root {
      --bg-dark: #080a0f;
      --bg-card: #121824;
      --bg-card-inner: #0b0e17;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-gold-hover: #d97706;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
      --radius: 12px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background-color: rgba(18, 24, 36, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.5px; }
    .brand-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
    }

    .user-info { display: none; align-items: center; gap: 16px; }
    .user-email { font-size: 0.875rem; color: var(--text-muted); }
    .btn-logout {
      background: transparent; border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 6px 14px; border-radius: 6px; cursor: pointer;
    }

    .container { max-width: 1240px; width: 100%; margin: 0 auto; padding: 2.5rem 1.5rem; flex: 1; }
    .view-screen { display: none; }
    .view-screen.active { display: block; }

    /* Login */
    .login-wrapper {
      max-width: 420px; margin: 3rem auto; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: var(--radius); padding: 2.5rem;
    }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-muted); }
    .form-group input {
      width: 100%; padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 1rem;
    }

    .btn-primary {
      width: 100%; background: var(--accent-gold); color: #000; font-weight: 700;
      padding: 0.85rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;
    }

    /* Dashboard */
    .page-title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .page-subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }
    .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }

    .category-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 1.75rem; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .category-card:hover { border-color: rgba(245, 158, 11, 0.4); transform: translateY(-3px); }

    .category-type-tag {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 0.75rem;
    }
    .type-juri { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); }
    .type-popular { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.3); }

    .category-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .category-desc { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; line-height: 1.4; }

    .status-badge { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; }
    .status-pending { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%;
    }

    /* Voting View */
    .voting-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .back-btn { background: transparent; border: none; color: var(--accent-gold); font-weight: 600; cursor: pointer; margin-bottom: 0.5rem; }
    
    .counter-box {
      background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 0.75rem 1.25rem; border-radius: var(--radius); text-align: right;
    }

    .nominees-list { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2.5rem; }
    
    .nominee-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: all 0.2s;
    }
    .nominee-card.approved { border-color: var(--accent-green); }
    .nominee-card.rejected { border-color: var(--accent-red); opacity: 0.6; }

    /* Layout Ajustado da Linha de Cabeçalho do Nomeado */
    .nominee-header-row {
      display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; padding: 1.25rem; border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    
    .nominee-info-group {
      display: flex; align-items: center; gap: 1.25rem; flex: 1; min-width: 280px;
    }

    .nominee-img-thumb {
      width: 90px; height: 90px; border-radius: 8px; background: #1e293b center/cover; flex-shrink: 0;
    }

    .nominee-main-info { flex: 1; }
    .nominee-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 0.2rem; }
    .nominee-sub { color: var(--accent-gold); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.4rem; }
    .nominee-desc { color: var(--text-muted); font-size: 0.875rem; line-height: 1.4; }

    /* Botões de Ação Perfeitamente Alinhados */
    .vote-actions {
      display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; margin-left: auto;
    }

    .btn-action {
      min-width: 115px; height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 1.25rem; border-radius: 8px; border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-weight: 700; cursor: pointer;
      font-size: 0.875rem; transition: all 0.2s ease; white-space: nowrap;
    }
    .btn-action.approve:hover, .btn-action.approve.active { background: var(--accent-green); color: #000; border-color: var(--accent-green); }
    .btn-action.reject:hover, .btn-action.reject.active { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

    /* Caixa de Declaração de Apoio */
    .declaration-box {
      background: var(--bg-card-inner); border-top: 1px solid var(--border-color);
      padding: 1.25rem; font-size: 0.875rem; line-height: 1.6; color: #cbd5e1;
    }

    .declaration-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;
    }

    .declaration-title {
      font-size: 0.85rem; font-weight: 700; color: var(--accent-gold); text-transform: uppercase;
      letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;
    }

    .declaration-text {
      max-height: 180px; overflow-y: auto; padding-right: 0.5rem; color: #94a3b8; font-style: normal;
    }
    
    .declaration-text::-webkit-scrollbar { width: 4px; }
    .declaration-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .bottom-bar {
      position: sticky; bottom: 1.5rem; background: rgba(18, 24, 36, 0.95);
      border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.25rem 2rem;
      display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>BIKES SUMMIT AWARDS</span>
      <span class="brand-badge">Júri</span>
    </div>
    <div class="user-info" id="userInfo">
      <span class="user-email" id="displayEmail">jurado@bikesummit.pt</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="container">

    <div id="loginView" class="view-screen active">
      <div class="login-wrapper">
        <div class="login-header">
          <h2>Portal de Votação do Júri</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Introduza os seus dados para avaliar os nomeados.</p>
        </div>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>E-mail do Jurado</label>
            <input type="email" id="email" value="jurado@bikesummit.pt" required>
          </div>
          <div class="form-group">
            <label>Palavra-passe</label>
            <input type="password" value="123456" required>
          </div>
          <button type="submit" class="btn-primary">Aceder às Categorias →</button>
        </form>
      </div>
    </div>

    <div id="categoriesView" class="view-screen">
      <h1 class="page-title">Categorias em Avaliação</h1>
      <p class="page-subtitle">Examine a Declaração de Apoio de cada candidatura e aprove todos os nomeados com mérito demonstrado.</p>
      <div class="categories-grid" id="categoriesGrid"></div>
    </div>

    <div id="nomineesView" class="view-screen">
      <div class="voting-header">
        <div>
          <button class="back-btn" onclick="showCategories()">← Voltar às Categorias</button>
          <h1 class="page-title" id="currentCategoryTitle">Categoria</h1>
          <span id="currentCategoryType" class="category-type-tag"></span>
        </div>
        <div class="counter-box">
          <div style="font-size: 0.8rem; color: var(--text-muted);">Aprovados nesta categoria</div>
          <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent-green);" id="approvedCount">0</div>
        </div>
      </div>

      <div class="nominees-list" id="nomineesGrid"></div>

      <div class="bottom-bar">
        <div style="font-size: 0.875rem; color: var(--text-muted);" id="ruleExplanation"></div>
        <button class="btn-primary" style="width: auto; padding: 0.75rem 2rem;" onclick="saveCategoryVotes()">
          Finalizar Categoria
        </button>
      </div>
    </div>

  </div>

  <script>
    const sampleDeclarationText1 = `A candidatura da Specialized Portugal destaca-se pelo trabalho rigoroso e de liderança demonstrado na indústria do ciclismo nacional ao longo do último ano. No que respeita ao critério de Inovação de Produto e Engenharia, a entidade evidenciou um nível de excelência notável através da introdução de soluções de assistência elétrica de última geração e quadros com geometria otimizada, garantindo ganhos significativos em segurança, ergonomia e eficiência aerodinâmica.

Em termos de Impacto no Mercado e Desenvolvimento do Retalho, a marca implementou um plano estratégico de capacitação das lojas parceiras em território nacional, promovendo um serviço técnico pós-venda padronizado e de alta fidelidade que elevou substancialmente a satisfação do consumidor final.

Adicionalmente, cumpre salientar o mérito no critério de Responsabilidade Social e Promoção da Modalidade. A candidatura comprovou o investimento ativo em programas de consciencialização rodoviária para ciclistas urbanos e o patrocínio direto a formações jovens de ciclismo de formação. Todas as metas de sustentabilidade propostas no regulamento foram amplamente superadas, com a transição para embalagens 100% recicláveis na distribuição nacional. Pela consistência técnica, visão de futuro e contribuição inequívoca para o ecossistema do ciclismo em Portugal, esta indicação reúne todos os requisitos para ser reconhecida com o galardão do Bikes Summit Awards.`;

    const sampleDeclarationText2 = `O Douro Granfondo apresenta uma candidatura exemplar que consubstancia a máxima expressão de qualidade organizacional, apuro técnico e valorização do património nacional através do desporto. Atendendo aos critérios de Qualidade Organizacional e Segurança, a estrutura do evento demonstrou capacidade de gestão logística de topo, mobilizando meios de socorro, corte rodoviário articulado com as forças de segurança e uma rede de abastecimentos rigorosamente planeada para mais de 3.000 atletas.

No vetor do Impacto Económico e Turístico, a iniciativa comprovou um preenchimento hoteleiro superior a 95% em toda a região do Alto Douro Vinhateiro durante o fim de semana da prova, gerando um retorno financeiro direto de elevado relevo para a restauração e comércio local.

Relativamente à Experiência do Participante e Inclusão, os inquéritos de satisfação anexados à candidatura evidenciam um índice de aprovação global de 94%, destacando a excelência do acolhimento, a sinalização exemplar dos percursos e o incentivo à participação de atletas femininas através de pelotões de apoio dedicados. A aposta na neutralidade de carbono do evento, com recolha seletiva de resíduos em todos os pontos do percurso, consolida o seu caráter inovador e sustentável, justificando integralmente o mérito para atribuição do prémio nesta edição.`;

    const sampleDeclarationText3 = `A candidatura do SRAM Transmission T-Type reflete uma verdadeira revolução na mecânica de transmissões para BTT. Sob os critérios de Inovação Disruptiva e Resistência Mecânica, a eliminação do carreteto de desafinação (patim) tradicional e a fixação direta ao eixo da roda estabeleceu um novo padrão de fiabilidade em condições extremas de piso e lama.

No que concerne ao Critério de Aplicabilidade e Segurança do Utilizador, os testes práticos demonstraram trocas de mudança fluidas sob carga máxima sem perda de tração ou desgaste prematuro da corrente. A facilidade de configuração e a integração com ecossistemas eletrónicos de telemetria reforçam a relevância técnica deste produto para atletas amadores e profissionais. Por estes fundamentos e pelo impacto gerado na indústria global, a indicação apresenta mérito indiscutível.`;

    const sampleDeclarationText4 = `A candidatura da Bikes & Beer Store evidencia um modelo de negócio inovador que reinventou o conceito de loja de bicicletas tradicional em Portugal. Nos critérios de Atendimento e Experiência do Cliente, o espaço combina uma oficina técnica certificada com uma zona comunitária de convivência para ciclistas, aumentando a taxa de retenção de clientes em 40% no último ano.

A nível de Responsabilidade Local e Atividades Comunitárias, o retalhista dinamiza passeios semanais gratuitos, workshops de mecânica básica para iniciantes e campanhas de promoção da mobilidade suave. A avaliação de satisfação do consumidor e o acompanhamento pós-venda exemplares justificam plenary o reconhecimento nesta categoria.`;

    const sampleDeclarationText5 = `O atleta destacou-se nesta temporada por uma prestação desportiva irrepreensível no panorama internacional, conquistando posições de pódio em etapas do circuito mundial e elevando as cores nacionais. Quanto aos critérios de Desempenho Desportivo e Fair Play, evidenciou constante resiliência, espírito de equipa e conduta ética irrepreensível perante adversários e regulamentos.

Adicionalmente, tem sido uma figura ativa na promoção do desporto jovem, participando voluntariamente em palestras de motivação e treinos abertos a escolas de ciclismo local. O seu compromisso com os valores do desporto faz desta candidatura uma referência indiscutível para o prémio do Júri.`;

    const sampleDeclarationText6 = `A iniciativa Ciclismo para Todos destacou-se pelo impacto direto na integração social e promoção da acessibilidade através da bicicleta. Atendendo aos critérios de Impacto Social e Sustentabilidade, o projeto adaptou dezenas de triciclos e bicicletas para pessoas com mobilidade reduzida, permitindo a utilização gratuita em parques urbanos e ciclovias regionais.

O envolvimento de voluntários comunitários e a parceria com instituições de solidariedade social garantiram uma abrangência superior a 1.200 beneficiários diretos ao longo dos últimos doze meses. A fundamentação apresentada demonstra um valor transformador e humanitário excecional.`;

        nominees: [
          { id: 'n501', name: 'João Almeida', sub: 'Ciclismo de Estrada', desc: 'Resultados de topo em grandes voltas e provas internacionais.', img: 'https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?w=400&q=80', declaration: sampleDeclarationText5, status: null },
          { id: 'n502', name: 'Iúri Leitão', sub: 'Pista & Estrada', desc: 'Títulos mundiais e europeus no ciclismo de pista.', img: 'https://images.unsplash.com/photo-1511994298241-608e28f14fde?w=400&q=80', declaration: sampleDeclarationText5, status: null },
          { id: 'n503', name: 'Raquel Queirós', sub: 'BTT Cross-Country', desc: 'Domínio nacional e presença assídua na Taça do Mundo.', img: 'https://images.unsplash.com/photo-1532298229144-0ec0c57515c7?w=400&q=80', declaration: sampleDeclarationText5, status: null }
        ]
      },
      {
        id: 'cat-6',
        title: 'Projeto Social & Sustentabilidade',
        type: 'popular',
        ruleText: '🗳️ Seleção para Voto Popular: Os 5 mais votados pelo Júri avançam para a votação do público.',
        description: 'Projetos e iniciativas de impacto social, mobilidade sustentável e inclusão através da bicicleta.',
        status: 'pending',
        nominees: [
          { id: 'n601', name: 'Ciclismo para Todos', sub: 'Inclusão Social', desc: 'Adaptação de bicicletas para pessoas com mobilidade reduzida.', img: 'https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=400&q=80', declaration: sampleDeclarationText6, status: null },
          { id: 'n602', name: 'Escolas de Pedal Sustentável', sub: 'Educação', desc: 'Formação rodoviária e incentivo ao uso da bicicleta em escolas primárias.', img: 'https://images.unsplash.com/photo-1576435728678-68d0fbf94e91?w=400&q=80', declaration: sampleDeclarationText6, status: null },
          { id: 'n603', name: 'Oficinas Comunitárias Recicla-Bike', sub: 'Economia Circular', desc: 'Recuperação e doação de bicicletas usadas para comunidades vulneráveis.', img: 'https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?w=400&q=80', declaration: sampleDeclarationText6, status: null }
        ]
      }
    ];

    let currentCategoryId = null;

    function switchScreen(id) {
      document.querySelectorAll('.view-screen').forEach(e => e.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function handleLogin(e) {
      e.preventDefault();
      document.getElementById('displayEmail').innerText = document.getElementById('email').value;
      document.getElementById('userInfo').style.display = 'flex';
      renderCategories();
      switchScreen('categoriesView');
    }

    function logout() {
      document.getElementById('userInfo').style.display = 'none';
      switchScreen('loginView');
    }

    function renderCategories() {
      const grid = document.getElementById('categoriesGrid');
      grid.innerHTML = categories.map(cat => {
        const approvedCount = cat.nominees.filter(n => n.status === 'approved').length;
        const typeBadge = cat.type === 'juri' 
          ? '<span class="category-type-tag type-juri">🏆 Decisão do Júri (Top 3)</span>'
          : '<span class="category-type-tag type-popular">🗳️ Apuramento Público (Top 5)</span>';

        const statusBadge = cat.status === 'completed'
          ? '<span class="status-badge status-completed">Concluída</span>'
          : '<span class="status-badge status-pending">Pendente</span>';

        return `
          <div class="category-card">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                ${typeBadge}
                ${statusBadge}
              </div>
              <h3 class="category-title">${cat.title}</h3>
              <p class="category-desc">${cat.description}</p>
            </div>
            <div>
              <p style="font-size:0.85rem; color:var(--accent-green); margin-bottom:0.75rem; font-weight:700;">
                ✓ ${approvedCount} Indicados Aprovados
              </p>
              <button class="btn-secondary" onclick="openCategory('${cat.id}')">
                ${cat.status === 'completed' ? 'Rever / Alterar Votos' : 'Avaliar Indicados →'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openCategory(id) {
      currentCategoryId = id;
      const cat = categories.find(c => c.id === id);
      document.getElementById('currentCategoryTitle').innerText = cat.title;
      
      const typeLabel = document.getElementById('currentCategoryType');
      typeLabel.innerText = cat.type === 'juri' ? 'Decisão Final Júri' : 'Apuramento Voto Popular';
      typeLabel.className = `category-type-tag ${cat.type === 'juri' ? 'type-juri' : 'type-popular'}`;

      document.getElementById('ruleExplanation').innerText = cat.ruleText;

      renderNominees();
      switchScreen('nomineesView');
    }

    function showCategories() {
      renderCategories();
      switchScreen('categoriesView');
    }

    function renderNominees() {
      const cat = categories.find(c => c.id === currentCategoryId);
      const approved = cat.nominees.filter(n => n.status === 'approved').length;
      document.getElementById('approvedCount').innerText = approved;

      const list = document.getElementById('nomineesGrid');
      list.innerHTML = cat.nominees.map(n => {
        let cardClass = 'nominee-card';
        if (n.status === 'approved') cardClass += ' approved';
        if (n.status === 'rejected') cardClass += ' rejected';

        return `
          <div class="${cardClass}">
            <div class="nominee-header-row">
              <div class="nominee-info-group">
                <div class="nominee-img-thumb" style="background-image: url('${n.img}')"></div>
                <div class="nominee-main-info">
                  <h3 class="nominee-title">${n.name}</h3>
                  <div class="nominee-sub">${n.sub}</div>
                  <p class="nominee-desc">${n.desc}</p>
                </div>
              </div>
              <div class="vote-actions">
                <button class="btn-action approve ${n.status === 'approved' ? 'active' : ''}" onclick="toggleVote('${n.id}', 'approved')">
                  ✓ Aprovar
                </button>
                <button class="btn-action reject ${n.status === 'rejected' ? 'active' : ''}" onclick="toggleVote('${n.id}', 'rejected')">
                  ✕ Reprovar
                </button>
              </div>
            </div>
            
            <div class="declaration-box">
              <div class="declaration-header">
                <span class="declaration-title">📜 Declaração de Apoio & Exposição de Mérito (Quem Indica)</span>
                <span style="font-size:0.75rem; color:var(--text-muted);">250 Palavras</span>
              </div>
              <div class="declaration-text">
                ${n.declaration}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleVote(nomineeId, action) {
      const cat = categories.find(c => c.id === currentCategoryId);
      const nominee = cat.nominees.find(n => n.id === nomineeId);

      if (action === 'approved') {
        nominee.status = nominee.status === 'approved' ? null : 'approved';
      } else {
        nominee.status = nominee.status === 'rejected' ? null : 'rejected';
      }

      renderNominees();
    }

    function saveCategoryVotes() {
      const cat = categories.find(c => c.id === currentCategoryId);
      cat.status = 'completed';
      showCategories();
    }
  </script>
</body>
</html>
